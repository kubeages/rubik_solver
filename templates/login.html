<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Rubik con grafos</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'><rect x='1' y='1' width='8.5' height='8.5' rx='2' fill='%23c8252c'/><rect x='10.75' y='1' width='8.5' height='8.5' rx='2' fill='%23f7c928'/><rect x='20.5' y='1' width='8.5' height='8.5' rx='2' fill='%231f8a4c'/><rect x='1' y='10.75' width='8.5' height='8.5' rx='2' fill='%231f5fbf'/><rect x='10.75' y='10.75' width='8.5' height='8.5' rx='2' fill='%23f2f2ec'/><rect x='20.5' y='10.75' width='8.5' height='8.5' rx='2' fill='%23f2842a'/><rect x='1' y='20.5' width='8.5' height='8.5' rx='2' fill='%23f7c928'/><rect x='10.75' y='20.5' width='8.5' height='8.5' rx='2' fill='%231f8a4c'/><rect x='20.5' y='20.5' width='8.5' height='8.5' rx='2' fill='%23c8252c'/></svg>">
  <style>
    :root {
      --bg: #faf8f3; --surface: #fff; --ink: #1d1d1f; --ink-2: #55534e; --ink-3: #8a877f;
      --line: #e2ddd1; --accent: #3b5bdb; --bad: #e03131;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15161a; --surface: #1d1f24; --ink: #f1efe9; --ink-2: #c4c1b8; --ink-3: #8f8c84;
              --line: #33363d; --accent: #7c93ff; --bad: #ff6b6b; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--ink);
    }
    .card {
      width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line);
      border-radius: 16px; padding: 28px; box-shadow: 0 4px 24px rgba(0,0,0,.07);
    }
    .mark {
      width: 46px; height: 46px; border-radius: 11px; margin-bottom: 18px;
      background: conic-gradient(#c8252c 0 25%, #f7c928 0 50%, #1f8a4c 0 75%, #1f5fbf 0);
    }
    h1 { font-size: 1.35rem; margin: 0 0 4px; letter-spacing: -.01em; }
    p.sub { margin: 0 0 20px; color: var(--ink-3); font-size: .9rem; }
    label { display: block; font-size: .85rem; font-weight: 600; margin: 0 0 5px; color: var(--ink-2); }
    input {
      width: 100%; font: inherit; padding: 11px 13px; margin-bottom: 14px; color: var(--ink);
      background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    button {
      width: 100%; font: inherit; font-weight: 600; font-size: 1rem; cursor: pointer;
      padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: #fff;
    }
    button:hover { filter: brightness(1.08); }
    .error {
      background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--ink);
      padding: 10px 12px; border-radius: 9px; font-size: .88rem; margin-bottom: 16px;
    }
    footer { margin-top: 18px; font-size: .78rem; color: var(--ink-3); text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true"></div>
    <h1>Rubik con grafos</h1>
    <p class="sub">Escribe tus credenciales para entrar.</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="POST" action="{{ url_for('login') }}?next={{ next|urlencode }}">
      <label for="username">Usuario</label>
      <input id="username" name="username" autocomplete="username" autofocus required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
    <footer>Resuelve tu cubo siguiendo un camino en un grafo.</footer>
  </main>
</body>
</html>
