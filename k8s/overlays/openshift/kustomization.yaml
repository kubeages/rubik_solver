apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rubik-solver

# The Route is not managed here on purpose: its host is site-specific, so it
# lives in the gitignored route.local.yaml (see route.local.yaml.example).
# Keeping it out of the overlay means re-applying never overwrites your host.
resources:
  - ../../base

images:
  - name: rubik-solver
    newName: image-registry.openshift-image-registry.svc:5000/rubik-solver/rubik-solver
    newTag: latest
